# Baselines for the API. Firing alerts show under Prometheus "Alerts" and on the Grafana dashboard.
groups:
  - name: event-registration-api
    rules:
      - alert: ApiDown
        expr: up{job="event-registration-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The API has not answered a metrics scrape for 1 minute.

      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="event-registration-api", status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="event-registration-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of API requests are failing with 5xx.

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="event-registration-api", uri!~"/api/v1/ws/.*"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 95th percentile API latency is above 1 second.

      - alert: HighHeapUsage
        expr: |
          sum(jvm_memory_used_bytes{job="event-registration-api", area="heap"})
            / sum(jvm_memory_max_bytes{job="event-registration-api", area="heap"} > 0) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: JVM heap usage is above 90%.

      - alert: DatabaseConnectionsPending
        expr: max(hikaricp_connections_pending{job="event-registration-api"}) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Requests are waiting for a database connection.
