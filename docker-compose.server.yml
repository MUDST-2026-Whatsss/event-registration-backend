name: event-registration

# Runs the API against the managed PostgreSQL configured by DB_URL.
# This file intentionally has no local PostgreSQL service or dependency.
services:
  minio:
    # Build the last upstream security release; its public registry tag is unavailable.
    image: event-registration-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - event_registration_minio_data:/data

  api:
    image: maven:3.9.16-eclipse-temurin-17
    working_dir: /workspace
    command: ["mvn", "-B", "-ntp", "spring-boot:run"]
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?Set the managed PostgreSQL JDBC URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set the managed PostgreSQL username in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set the managed PostgreSQL password in .env}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_ISSUER: ${JWT_ISSUER:-event-registration}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOCKOUT_MAX_ATTEMPTS: ${LOCKOUT_MAX_ATTEMPTS:-5}
      LOCKOUT_DURATION: ${LOCKOUT_DURATION:-15m}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN_PER_IP: ${RATE_LIMIT_LOGIN_PER_IP:-10}
      RATE_LIMIT_LOGIN_PER_ACCOUNT: ${RATE_LIMIT_LOGIN_PER_ACCOUNT:-5}
      RATE_LIMIT_GLOBAL_PER_IP: ${RATE_LIMIT_GLOBAL_PER_IP:-300}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-false}
      STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-event-registration}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      STORAGE_MAX_IMAGE_SIZE: ${STORAGE_MAX_IMAGE_SIZE:-2MB}
      STORAGE_MAX_IMAGE_WIDTH: ${STORAGE_MAX_IMAGE_WIDTH:-6000}
      STORAGE_MAX_IMAGE_HEIGHT: ${STORAGE_MAX_IMAGE_HEIGHT:-6000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - event_registration_maven_cache:/root/.m2
    depends_on:
      minio:
        condition: service_started

volumes:
  event_registration_minio_data:
  event_registration_maven_cache:
