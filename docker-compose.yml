version: '3.8'

services:
  postgres_db:
    image: postgres:15 # หรือระบุเวอร์ชันที่ต้องการ เช่น postgres:latest
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: Whatsss         # ตั้งชื่อ Username
      POSTGRES_PASSWORD: Eventsss # ตั้งรหัสผ่าน
      POSTGRES_DB: Eventsss_DB       # ตั้งชื่อฐานข้อมูลเริ่มต้น
    ports:
      - "5432:5432" # แมปพอร์ต เครื่องของคุณ : ภายใน Docker
    volumes:
      - ./pg-data:/var/lib/postgresql/data # เก็บไฟล์ข้อมูลไว้ในโฟลเดอร์ pg-data
      - ./DB_init.sql:/docker-entrypoint-initdb.d/init.sql # Initialize database with script