# PostgreSQL connection properties are supplied by PostgresIntegrationTest. Tests run the real
# Flyway migrations instead of an H2/Hibernate approximation.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# A fixed 48-byte test key. Only ever used by isolated test containers.
event.auth.jwt-secret=dGVzdC1vbmx5LXNpZ25pbmcta2V5LWZvci11bml0LXRlc3RzLW5vdC1hLXNlY3JldA==
event.auth.cookie-secure=false
event.auth.registration-auto-verify=true
event.auth.rate-limit.enabled=false
management.endpoint.health.show-details=never
