<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Registration — API Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #16181d;
      margin: 0;
      padding: 32px 16px;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #6b7280; font-size: 13.5px; margin: 0 0 24px; }
    .card {
      background: #fff;
      border: 1px solid #e7e8ec;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }
    .card h2 { font-size: 15px; margin: 0 0 14px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    input {
      flex: 1;
      min-width: 140px;
      padding: 9px 11px;
      border: 1px solid #e7e8ec;
      border-radius: 8px;
      font-size: 13.5px;
    }
    button {
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      background: #5b54f5;
      color: #fff;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
    }
    button:hover { background: #4a44e0; }
    button.ghost { background: #fff; border: 1px solid #e7e8ec; color: #16181d; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eef0f3; }
    th { color: #9aa1ac; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .pill {
      display: inline-block; padding: 3px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 700; background: #eef0fe; color: #5b54f5;
    }
    #status { font-size: 12.5px; color: #6b7280; margin-top: 10px; min-height: 16px; }
    #status.error { color: #ef4444; }
    #status.ok { color: #16a34a; }
    .empty { color: #9aa1ac; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Event Registration API — Live Demo</h1>
    <p class="sub">This page talks directly to the real <code>/api/events</code> backend and the real database — nothing here is mocked.</p>

    <div class="card">
      <h2>Create Event</h2>
      <div class="row">
        <input id="title" placeholder="Title (required)" />
        <input id="category" placeholder="Category" />
        <input id="maxParticipants" type="number" placeholder="Max participants" />
      </div>
      <button id="createBtn">Create Event</button>
      <div id="status"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content: space-between; align-items: center;">
        <h2 style="margin:0">Events</h2>
        <button class="ghost" id="refreshBtn">Refresh</button>
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Title</th><th>Category</th><th>Status</th><th>Max</th><th></th></tr>
        </thead>
        <tbody id="eventsBody"></tbody>
      </table>
      <div id="empty" class="empty" hidden>No events yet — create one above.</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const bodyEl = document.getElementById('eventsBody');
    const emptyEl = document.getElementById('empty');

    function setStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = kind || '';
    }

    async function loadEvents() {
      const res = await fetch('/api/events');
      const events = await res.json();
      bodyEl.innerHTML = '';
      emptyEl.hidden = events.length > 0;
      for (const ev of events) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${ev.id}</td>
          <td>${escapeHtml(ev.title)}</td>
          <td>${escapeHtml(ev.category || '-')}</td>
          <td><span class="pill">${escapeHtml(ev.status)}</span></td>
          <td>${ev.maxParticipants ?? '-'}</td>
          <td><button class="danger" data-id="${ev.id}">Delete</button></td>
        `;
        bodyEl.appendChild(tr);
      }
      bodyEl.querySelectorAll('button[data-id]').forEach((btn) => {
        btn.addEventListener('click', () => deleteEvent(btn.dataset.id));
      });
    }

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value ?? '';
      return div.innerHTML;
    }

    async function createEvent() {
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value.trim();
      const maxParticipantsRaw = document.getElementById('maxParticipants').value;

      const payload = {
        title,
        category: category || null,
        maxParticipants: maxParticipantsRaw ? Number(maxParticipantsRaw) : null,
      };

      const res = await fetch('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        setStatus(body.error || `Failed (HTTP ${res.status})`, 'error');
        return;
      }

      document.getElementById('title').value = '';
      document.getElementById('category').value = '';
      document.getElementById('maxParticipants').value = '';
      setStatus('Event created.', 'ok');
      await loadEvents();
    }

    async function deleteEvent(id) {
      const res = await fetch(`/api/events/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        setStatus(`Failed to delete event ${id}`, 'error');
        return;
      }
      setStatus(`Deleted event ${id}.`, 'ok');
      await loadEvents();
    }

    document.getElementById('createBtn').addEventListener('click', createEvent);
    document.getElementById('refreshBtn').addEventListener('click', () => loadEvents());

    loadEvents().catch(() => setStatus('Could not reach the API.', 'error'));
  </script>
</body>
</html>
