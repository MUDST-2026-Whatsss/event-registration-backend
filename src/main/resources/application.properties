spring.application.name=event-registration

# PostgreSQL Database Configuration
# Containers and deployed environments must provide these values through env.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_registration}
spring.datasource.username=${DB_USERNAME:event_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Always select the application schema explicitly. Some managed PostgreSQL
# poolers start connections with an empty search_path.
spring.datasource.hikari.schema=${DB_SCHEMA:public}

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway is the only schema owner. New databases start from B6; the existing
# local database keeps its repaired V1-V6 history.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${DB_SCHEMA:public}
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Authentication. Secrets must come from the environment; JWT_SECRET has no
# default so the application refuses to start with a guessable signing key.
# Every value below is overridable from the environment so that tuning a limit
# or a lifetime is a deploy-time change, not a code change. Only JWT_SECRET has
# no default: the application must refuse to start rather than sign tokens with
# a key that is public in this repository.
event.auth.jwt-secret=${JWT_SECRET}
event.auth.jwt-issuer=${JWT_ISSUER:event-registration}
event.auth.access-token-ttl=${ACCESS_TOKEN_TTL:15m}
event.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:7d}
# Production registrations remain pending until the email-verification flow consumes an action
# token. Only local/test profiles may override this to true.
event.auth.registration-auto-verify=false

# Secure cookies require HTTPS, so local HTTP development overrides this to
# false via the `local` profile.
event.auth.cookie-secure=${COOKIE_SECURE:true}
event.auth.cookie-same-site=${COOKIE_SAME_SITE:Lax}
event.auth.cookie-domain=${COOKIE_DOMAIN:}

# Brute-force lockout, enforced in PostgreSQL so it holds across instances.
event.auth.lockout.max-failed-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
event.auth.lockout.duration=${LOCKOUT_DURATION:15m}

# Per-process request limits. See RateLimiterService for why these do not
# survive horizontal scaling on their own.
event.auth.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
event.auth.rate-limit.login-per-ip=${RATE_LIMIT_LOGIN_PER_IP:10}
event.auth.rate-limit.login-per-account=${RATE_LIMIT_LOGIN_PER_ACCOUNT:5}
event.auth.rate-limit.global-per-ip=${RATE_LIMIT_GLOBAL_PER_IP:300}
event.auth.rate-limit.window=${RATE_LIMIT_WINDOW:1m}
# Only enable behind a proxy that overwrites X-Forwarded-For, otherwise a
# client can spoof the header and evade the per-IP limit entirely.
event.auth.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}

event.auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Private S3-compatible storage. The API proxies public event images, so the
# bucket itself never needs anonymous read access. Compose enables this and
# points the endpoint at the internal `minio` service.
event.storage.enabled=${STORAGE_ENABLED:false}
event.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
event.storage.access-key=${STORAGE_ACCESS_KEY:}
event.storage.secret-key=${STORAGE_SECRET_KEY:}
event.storage.bucket=${STORAGE_BUCKET:event-registration}
event.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}
event.storage.max-image-size=${STORAGE_MAX_IMAGE_SIZE:2MB}
event.storage.max-image-width=${STORAGE_MAX_IMAGE_WIDTH:6000}
event.storage.max-image-height=${STORAGE_MAX_IMAGE_HEIGHT:6000}

# Cap request bodies so a huge payload cannot exhaust memory before validation.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=4MB
server.tomcat.max-http-form-post-size=256KB
server.tomcat.max-swallow-size=2MB

# Do not advertise the server implementation to clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Expose only what the container healthcheck needs.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
