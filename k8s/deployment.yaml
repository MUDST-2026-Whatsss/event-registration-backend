apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-registration-api
  namespace: event-registration
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: event-registration-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: event-registration-api
    spec:
      containers:
        - name: api
          # CI replaces this with the tested image tag (commit SHA)
          image: ghcr.io/mudst-2026-whatsss/event-registration:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: event-registration-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: event-registration-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: event-registration-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: event-registration-secret
                  key: JWT_SECRET
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: event-registration-secret
                  key: STORAGE_ACCESS_KEY
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: event-registration-secret
                  key: STORAGE_SECRET_KEY
          # Restart the container if it stops responding
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          # Only send traffic once the app, database and storage are ready
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
