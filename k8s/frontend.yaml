# The frontend nginx proxies /api/ to http://api:8080 (same name as in docker-compose),
# so give the API pods a second Service called "api".
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: event-registration
spec:
  type: ClusterIP
  selector:
    app: event-registration-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-registration-frontend
  namespace: event-registration
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: event-registration-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: event-registration-frontend
    spec:
      containers:
        - name: frontend
          # CI replaces latest with the same release tag used by image-only Compose.
          image: ghcr.io/mudst-2026-whatsss/event-registration-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: event-registration-frontend
  namespace: event-registration
spec:
  type: NodePort
  selector:
    app: event-registration-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30090
