apiVersion: v1
kind: ConfigMap
metadata:
  name: event-registration-config
  namespace: event-registration
data:
  # Minikube is a plain-HTTP dev environment, so use the local profile
  # (non-secure cookies, auto-verified sign up) like docker-compose does.
  SPRING_PROFILES_ACTIVE: local
  DB_URL: jdbc:postgresql://postgres:5432/event_registration
  DB_SCHEMA: public
  POSTGRES_DB: event_registration
  JWT_ISSUER: event-registration
  ACCESS_TOKEN_TTL: 15m
  REFRESH_TOKEN_TTL: 7d
  COOKIE_SECURE: "false"
  COOKIE_SAME_SITE: Lax
  # Classroom Ingress on port 80/16969, plus the existing local entry points.
  CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:16969,http://127.0.0.1:16969,http://localhost:8090,http://127.0.0.1:8090,http://192.168.49.2:30090,http://localhost:5173
  STORAGE_ENABLED: "true"
  STORAGE_ENDPOINT: http://minio:9000
  STORAGE_BUCKET: event-registration
  # Readiness probe waits for the database and MinIO too
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db,objectStorage
