name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run the pipeline (including the Kubernetes deploy) by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      frontend-sha: ${{ steps.frontend-revision.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run unit + integration tests
        run: ./mvnw -B verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install E2E dependencies
        run: npm ci

      - name: Prepare local test environment
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-random-local-password/local_db_password_ci/' .env
          sed -i 's/replace-with-openssl-rand-base64-48/dGhpcy1pcy1hLXJhbmRvbS1qd3Qtc2VjcmV0LWZvci1jaS10ZXN0aW5nLTIwMjY=/' .env
          sed -i 's/replace-with-minio-access-key/event_minio_admin/' .env
          sed -i 's/replace-with-a-long-random-minio-secret/event_minio_ci_secret_12345/' .env

      - name: Start services with Docker Compose
        run: docker compose up -d --build postgres minio api

      - name: Wait for API health
        run: |
          timeout 120s bash -c 'until curl -sf http://127.0.0.1:8080/api/health; do echo "Waiting for backend API..."; sleep 3; done'

      - name: Run Backend API Cypress E2E tests
        run: npm run test:e2e

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: MUDST-2026-Whatsss/event-registration-frontend
          ref: develop
          path: frontend

      - name: Record frontend revision
        id: frontend-revision
        working-directory: frontend
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Frontend unit tests, build and browser tests
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm run test:e2e

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            frontend/cypress/screenshots
            frontend/cypress/videos
          if-no-files-found: ignore

      - name: Set lowercase image prefix
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/event-registration" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  deploy-kubernetes:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Minikube
        run: |
          curl -sLO https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          # Newer Minikube defaults to containerd; use Docker so docker-env works
          minikube start --driver=docker --container-runtime=docker
          kubectl get nodes
          minikube addons enable ingress
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s

      - name: Load images into Minikube
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/event-registration:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          # Use Minikube's Docker so the cluster can see the images directly
          eval $(minikube docker-env)
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker pull "$IMAGE"
          docker build -t event-registration-minio:RELEASE.2025-10-15T17-29-55Z -f docker/minio/Dockerfile .

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: MUDST-2026-Whatsss/event-registration-frontend
          # Reuse the exact frontend revision tested by build-and-test.
          ref: ${{ needs.build-and-test.outputs.frontend-sha }}
          path: frontend

      - name: Build frontend image in Minikube
        run: |
          test "$(git -C frontend rev-parse HEAD)" = "${{ needs.build-and-test.outputs.frontend-sha }}"
          eval $(minikube docker-env)
          docker build -t event-registration-frontend:local frontend

      - name: Create namespace and secret
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n event-registration create secret generic event-registration-secret \
            --from-literal=DB_USERNAME=event_app \
            --from-literal=DB_PASSWORD=$(openssl rand -hex 16) \
            --from-literal=JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n') \
            --from-literal=STORAGE_ACCESS_KEY=event_minio_admin \
            --from-literal=STORAGE_SECRET_KEY=$(openssl rand -hex 16)

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/configmap.yaml -f k8s/postgres.yaml -f k8s/minio.yaml -f k8s/service.yaml
          # Wait for the database and storage before starting the API
          kubectl -n event-registration rollout status statefulset/postgres --timeout=180s
          kubectl -n event-registration rollout status deployment/minio --timeout=180s
          # Deploy the exact image that was tested in the previous job
          sed "s|ghcr.io/mudst-2026-whatsss/event-registration:latest|$IMAGE|" k8s/deployment.yaml | kubectl apply -f -
          kubectl -n event-registration rollout status deployment/event-registration-api --timeout=300s
          kubectl apply -f k8s/frontend.yaml
          kubectl -n event-registration rollout status deployment/event-registration-frontend --timeout=180s
          kubectl apply -f k8s/ingress.yaml

      - name: Smoke test deployed API
        run: |
          kubectl -n event-registration get pods,svc,pvc
          kubectl -n event-registration port-forward service/event-registration-api 8080:8080 &
          sleep 5
          curl -sf http://127.0.0.1:8080/api/health
          curl -sf http://127.0.0.1:8080/actuator/health/readiness
          # Frontend page, and the API through the frontend's nginx proxy
          kubectl -n event-registration port-forward service/event-registration-frontend 8090:80 &
          sleep 5
          curl -sf -o /dev/null http://127.0.0.1:8090/
          curl -sf http://127.0.0.1:8090/api/health

      - name: Smoke test classroom Ingress
        run: |
          kubectl -n ingress-nginx port-forward service/ingress-nginx-controller 16969:80 > /tmp/ingress-forward.log 2>&1 &
          timeout 60s bash -c 'until curl -fsS http://127.0.0.1:16969/event-registration/api/health; do sleep 2; done'
          curl -fsS http://127.0.0.1:16969/event-registration/ | grep -q '<div id="app">'
          curl -fsS http://127.0.0.1:16969/api/health

      - name: Record deployed revisions
        run: |
          echo "Backend: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: ${{ needs.build-and-test.outputs.frontend-sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Classroom Ingress checks passed. This Minikube environment exists only for this Actions run." >> "$GITHUB_STEP_SUMMARY"

      - name: Show pod details on failure
        if: failure()
        run: |
          kubectl -n event-registration get pods -o wide
          kubectl -n event-registration describe pods
          kubectl -n event-registration logs deployment/event-registration-api --tail=100
          kubectl -n event-registration logs deployment/event-registration-frontend --tail=50
