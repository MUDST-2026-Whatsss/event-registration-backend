# Grafana observability stack: metrics (Prometheus), logs (Loki via Alloy), traces (Tempo).
# Layer it on top of the stack you already run, for example:
#   docker compose -f docker-compose.server.yml -f docker-compose.observability.yml up -d
# Grafana: http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD, default admin)
# Prometheus: http://localhost:9090
name: event-registration

services:
  api:
    environment:
      MANAGEMENT_ENDPOINTS: health,prometheus
      TRACING_EXPORT_ENABLED: "true"
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # Tempo's metrics generator writes service-graph and span metrics here.
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - observability_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  loki:
    image: grafana/loki:3.5.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - observability_loki_data:/loki

  # Tempo runs as uid 10001; give it the data volume before it starts.
  tempo-init:
    image: grafana/tempo:2.8.1
    user: root
    entrypoint: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - observability_tempo_data:/var/tempo

  tempo:
    image: grafana/tempo:2.8.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - observability_tempo_data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully

  # Replaces Promtail (end of life): tails this project's container logs and pushes them to Loki.
  alloy:
    image: grafana/alloy:v1.9.1
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/event-registration.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - observability_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  observability_prometheus_data:
  observability_loki_data:
  observability_tempo_data:
  observability_grafana_data:
